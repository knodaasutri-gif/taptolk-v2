<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワンタッチ意思表示カード</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 読み上げテキスト表示エリア -->
        <div class="speech-display" id="speechDisplay">
            <span id="displayText" class="placeholder-text">カードをタップするとここに文字が表示されます</span>
            <div class="speech-control-btns">
                <button class="stop-btn" id="stopBtn" style="display: none;">🛑 停止</button>
                <button class="clear-btn" id="clearBtn" style="display: none;">🧹 クリア</button>
            </div>
        </div>

        <!-- 自由テキスト入力欄 (初期状態は非表示) -->
        <div class="text-input-container" id="textInputContainer">
            <input type="text" id="customTextInput" placeholder="伝えたい言葉を入力...">
            <button class="clear-input-btn" id="clearInputBtn">✕</button>
            <button class="submit-btn" id="submitTextBtn">発話</button>
        </div>

        <!-- 操作バー -->
        <div class="action-bar">
            <button class="action-btn mic-btn" id="micBtn">🎤 音声入力</button>
            <button class="action-btn text-btn" id="textToggleBtn">✏️ 自由入力</button>
            <button class="action-btn add-btn" id="openAddModalBtn">➕ カード作成</button>
            <button class="action-btn manage-btn" id="manageBtn">⚙️ 編集</button>
        </div>

        <!-- カテゴリタブ -->
        <div class="category-tabs" id="categoryTabs">
            <!-- JSで動的生成 -->
        </div>

        <!-- 日時指定エリア (特定カテゴリ選択時に表示) -->
        <div class="calendar-section" id="calendarSection" style="display: none;">
            <h3>📅 日時を選んでワンタッチ連絡</h3>
            <div class="cal-controls">
                <input type="date" id="targetDate">
                <div class="quick-date-btns">
                    <button class="qdate-btn active" data-type="today">今日</button>
                    <button class="qdate-btn" data-type="tomorrow">明日</button>
                    <button class="qdate-btn" data-type="afterTomorrow">明後日</button>
                </div>
            </div>
            <div class="time-select-row">
                <label>⏰ 時間指定（必要な場合）：</label>
                <select id="targetTime">
                    <option value="">なし</option>
                </select>
            </div>
            <div class="quick-leave-grid">
                <button class="leave-quick-btn" data-type="full">📅 終日お休み</button>
                <button class="leave-quick-btn" data-type="late">⏱️ 時間指定遅刻</button>
                <button class="leave-quick-btn" data-type="early">🏃 時間指定早退</button>
                <button class="leave-quick-btn" data-type="am">🌅 午前休</button>
                <button class="leave-quick-btn" data-type="pm">🌄 午後休</button>
                <button class="leave-quick-btn" data-type="hospital">🏥 通院（時間指定）</button>
            </div>
        </div>

        <!-- カード一覧グリッド -->
        <div class="cards-grid" id="cardsGrid">
            <!-- JSで動的生成 -->
        </div>
    </div>

    <!-- カード追加モーダル -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div class="modal-header">新規カード作成</div>
            <div class="form-group">
                <label>カテゴリー</label>
                <select id="cardCategorySelect"></select>
            </div>
            <div class="form-group">
                <label>アイコン (絵文字)</label>
                <input type="text" id="cardIconInput" value="💬">
            </div>
            <div class="form-group">
                <label>伝える言葉</label>
                <input type="text" id="cardTextInput" placeholder="例: お願いします">
            </div>
            <div class="modal-btns">
                <button class="modal-btn cancel" id="closeAddModalBtn">キャンセル</button>
                <button class="modal-btn save" id="saveCardBtn">追加</button>
            </div>
        </div>
    </div>

    <!-- トースト通知 -->
    <div class="toast-msg" id="toastMsg"></div>

    <script src="script.js"></script>
</body>
</html>
